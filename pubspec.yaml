name: ai_study_planner
description: "AI-Powered Study Planner for Tertiary Students - Layered Architecture, Offline-First, Gemini AI, SQLite & Cloud Sync"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management (Layered Architecture / MVVM)
  provider: ^6.1.2

  # Local Persistence (Offline-First SQLite Storage)
  sqflite: ^2.3.3+1
  path_provider: ^2.1.4
  path: ^1.9.0
  shared_preferences: ^2.3.2

  # Networking & AI Integration (Google Gemini REST API)
  http: ^1.2.2

  # Local Notifications & Timezone Scheduling
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Utilities & UI Enhancements
  intl: ^0.19.0
  uuid: ^4.5.1
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
